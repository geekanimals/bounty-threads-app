<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Your offer</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <style>
    :root{--ink:#14162b;--muted:#5d6380;--line:#e7e9f3;--brand:#5b5bf0;--bg:#f5f6fb}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
    .card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px 22px;text-align:center;box-shadow:0 18px 40px rgba(20,22,60,.08)}
    .brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    h1{font-size:22px;margin:8px 0 4px;line-height:1.25}
    .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
    .code{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--brand);border-radius:14px;padding:16px 12px;margin:0 0 14px;cursor:pointer;background:#f7f7ff;user-select:all}
    .code b{font-size:26px;letter-spacing:.08em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
    .code span{font-size:12px;color:var(--brand);font-weight:700;white-space:nowrap}
    .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#5b5bf0,#8f6bff);cursor:pointer;text-decoration:none}
    .skip{display:inline-block;margin-top:14px;color:var(--muted);font-size:13px}
    .by{margin-top:18px;font-size:12px;color:#9aa0b8}
    .spin{width:28px;height:28px;border:3px solid #dfe1f2;border-top-color:var(--brand);border-radius:50%;margin:10px auto;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    .ok{color:#12b76a}
  </style>
</head>
<body>
<div class="wrap"><div class="card" id="box"><div class="spin"></div><div class="sub">Opening your offer…</div></div></div>
<script src="/api/config"></script>
<script>
(function(){
  var URL_ = (window.GEEK_CONFIG && GEEK_CONFIG.supabaseUrl) || "https://edibibytqfrrxfztukpm.supabase.co";
  var KEY = (window.GEEK_CONFIG && GEEK_CONFIG.supabaseKey) || "sb_publishable_3tB8b43BqyJSO6_5HIVbTw_d5QOZqDf";
  var m = location.pathname.match(/\/go\/([a-z0-9]{5,16})/i), slug = (m && m[1]) || new URLSearchParams(location.search).get("s") || "";
  var box = document.getElementById("box");
  var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var vid = ""; try{ vid = localStorage.getItem("gk_v") || ""; if(!vid){ vid = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("gk_v", vid); } }catch(e){ vid = ""; }
  var device = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? "mobile" : "desktop";
  var ref = document.referrer ? (function(){ try{ return new URL(document.referrer).hostname; }catch(e){ return ""; } })() : (/Instagram/i.test(navigator.userAgent) ? "instagram app" : /FBAN|FBAV/i.test(navigator.userAgent) ? "facebook app" : "");
  var call = function(kind){
    return fetch(URL_ + "/rest/v1/rpc/track_open", { method:"POST", keepalive:true,
      headers:{ "apikey":KEY, "Authorization":"Bearer " + KEY, "Content-Type":"application/json" },
      body: JSON.stringify({ p_slug: slug, p_kind: kind, p_visitor: vid, p_device: device, p_ref: ref }) }).then(function(r){ return r.json(); });
  };
  var go = function(dest){ location.replace(dest); };
  var fail = function(msg){ box.innerHTML = '<h1>Link not found</h1><p class="sub">' + esc(msg || "This link isn't active any more.") + '</p>'; };
  if(!slug){ fail(); return; }
  call("click").then(function(d){
    if(!d || !d.ok){ fail(); return; }
    var dest = d.dest && /^https?:\/\//i.test(d.dest) ? d.dest : "";
    if(!d.code){                                   // no code → straight to the shop
      if(dest){ box.innerHTML = '<div class="spin"></div><div class="sub">Taking you to ' + esc(d.brand || "the shop") + '…</div>'; go(dest); }
      else fail("The shop link isn't set yet — please try again later.");
      return;
    }
    box.innerHTML = '<div class="brand">' + esc(d.brand || "") + '</div>'
      + '<h1>' + (d.discount ? esc(d.discount) : "Your discount code") + '</h1>'
      + '<p class="sub">' + (d.creator ? "From @" + esc(d.creator) + " · " : "") + 'use this code at checkout</p>'
      + '<div class="code" id="code" title="Tap to copy"><b>' + esc(d.code) + '</b><span id="cp">TAP TO COPY</span></div>'
      + (dest ? '<button class="btn" id="shop">Copy code &amp; shop now →</button><a class="skip" href="' + esc(dest) + '" id="skip">Continue without copying</a>' : '<p class="sub">Use it on ' + esc(d.brand || "the brand") + '\'s website or app.</p>')
      + '<div class="by">Offer shared by your creator · Geek</div>';
    var copied = false;
    var copy = function(){
      var done = function(){ document.getElementById("cp").innerHTML = '<span class="ok">✓ COPIED</span>'; };
      try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(d.code).then(done, done); } else { var t = document.createElement("textarea"); t.value = d.code; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); done(); } }catch(e){ done(); }
      if(!copied){ copied = true; call("copy").catch(function(){}); }
    };
    document.getElementById("code").onclick = copy;
    var shop = document.getElementById("shop");
    if(shop) shop.onclick = function(){ copy(); call("shop").catch(function(){}); setTimeout(function(){ go(dest); }, 350); };
    var skip = document.getElementById("skip");
    if(skip) skip.onclick = function(e){ e.preventDefault(); call("shop").catch(function(){}); setTimeout(function(){ go(dest); }, 200); };
  }).catch(function(){ fail("Couldn't open the offer — check your internet and try again."); });
})();
</script>
</body>
</html>
