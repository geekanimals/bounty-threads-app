<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace — Geek Influencer OS</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/geek-icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/geek-icon-192.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="description" content="A creator agency workspace, powered by Geek Influencer OS.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{background:var(--bg,#f7f8fc);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    .pub-wrap{max-width:820px;margin:0 auto;padding:24px 18px 60px}
    .pub-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .pub-brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink,#1a1c2e);font-weight:800}
    .pub-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#6c5ce7,#8f7bff);color:#fff;display:grid;place-items:center;font-weight:800}
    .pub-cta{background:#111;color:#fff;text-decoration:none;border-radius:10px;padding:9px 15px;font-weight:600;font-size:13px}
    .pub-foot{text-align:center;margin-top:26px;color:var(--muted,#5a6079);font-size:13px}
    .pub-foot a{color:#6c5ce7;text-decoration:none;font-weight:600}
    .pub-loading,.pub-empty{text-align:center;padding:60px 20px;color:var(--muted,#5a6079)}
    .org-hero{background:var(--panel,#fff);border:1px solid var(--line,#e9ecf5);border-radius:20px;padding:28px;text-align:center;box-shadow:var(--shadow,0 10px 30px rgba(20,20,60,.06))}
    .org-logo{width:72px;height:72px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center;font-weight:900;font-size:26px;color:#fff;background:linear-gradient(135deg,#6c5ce7,#8f7bff);object-fit:cover}
    .org-name{font-size:26px;font-weight:900}
    .org-tag{color:var(--muted,#5a6079);margin-top:4px;font-weight:600}
    .org-bio{margin:14px auto 0;max-width:560px;color:var(--ink,#1a1c2e);line-height:1.5}
    .org-stats{display:flex;gap:14px;justify-content:center;margin-top:18px;flex-wrap:wrap}
    .org-stat{background:var(--panel-2,#f4f5fb);border-radius:14px;padding:12px 20px;min-width:96px}
    .org-stat b{display:block;font-size:22px;font-weight:900}
    .org-stat span{font-size:12px;color:var(--muted,#5a6079);font-weight:600}
    .org-contact{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
    .org-btn{text-decoration:none;border-radius:11px;padding:10px 16px;font-weight:700;font-size:14px;border:1px solid var(--line,#e9ecf5);color:var(--ink,#1a1c2e);background:var(--panel,#fff)}
    .org-btn.wa{background:#25D366;color:#fff;border-color:#25D366}
    .org-sec{margin-top:26px}
    .org-sec h3{font-size:15px;font-weight:800;margin-bottom:12px}
    .cr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
    .cr-card{display:flex;align-items:center;gap:12px;background:var(--panel,#fff);border:1px solid var(--line,#e9ecf5);border-radius:14px;padding:13px}
    .cr-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#6c5ce7,#8f7bff);flex:none}
    .cr-main{min-width:0}
    .cr-n{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cr-s{font-size:12px;color:var(--muted,#5a6079)}
    .pub-mark{background:url(/assets/geek-icon-192.png) center/contain no-repeat;color:transparent;font-size:0;box-shadow:none;border-radius:0}
  </style>
</head>
<body>
<div class="pub-wrap">
  <div class="pub-top">
    <a href="index.html" class="pub-brand"><span class="pub-mark">G</span> Geek Influencer OS</a>
    <a href="app.html" class="pub-cta">Get your own workspace →</a>
  </div>
  <div id="org"><div class="pub-loading">Loading workspace…</div></div>
  <div class="pub-foot">Powered by <a href="index.html">Geek Influencer OS</a> — the OS for creators, brands &amp; agencies.</div>
</div>

<script src="/api/config"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = (window.GEEK_CONFIG && GEEK_CONFIG.supabaseUrl) || 'https://edibibytqfrrxfztukpm.supabase.co';
const SUPABASE_KEY = (window.GEEK_CONFIG && GEEK_CONFIG.supabaseKey) || 'sb_publishable_3tB8b43BqyJSO6_5HIVbTw_d5QOZqDf';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

function esc(v){ if(v==null) return ""; return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function safeUrl(u){ if(u==null) return "#"; const s=String(u).trim(); if(/^https?:\/\//i.test(s)||s.startsWith("/")||s.startsWith("#")) return s; if(/^[a-z0-9.-]+\.[a-z]{2,}([\/?#]|$)/i.test(s)) return "https://"+s; return "#"; }
function fmtNum(n){ return (Number(n)||0).toLocaleString('en-IN'); }
function initials(s){ return esc((s||"?").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase()); }
function waDigits(raw){ if(!raw) return ""; let d=String(raw).replace(/[^\d+]/g,""); if(d.startsWith("+")) return d.slice(1); d=d.replace(/\D/g,""); if(d.length===10) return "91"+d; return d; }

function renderOrg(o){
  const stat=(v,l)=>`<div class="org-stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`;
  const logo = o.logo_url ? `<img class="org-logo" src="${esc(safeUrl(o.logo_url))}" alt="">` : `<div class="org-logo">${initials(o.display_name)}</div>`;
  const creators = Array.isArray(o.creators) ? o.creators : [];
  const crCards = creators.map(c=>`<div class="cr-card"><div class="cr-av">${initials(c.name)}</div>
    <div class="cr-main"><div class="cr-n">${esc(c.name)}</div>
    <div class="cr-s">${[c.tier,c.followers,c.city].filter(Boolean).map(esc).join(" · ")||"—"}</div></div></div>`).join("");
  const contact = [];
  if(o.whatsapp) contact.push(`<a class="org-btn wa" href="https://wa.me/${waDigits(o.whatsapp)}" target="_blank" rel="noopener">💬 WhatsApp</a>`);
  if(o.email) contact.push(`<a class="org-btn" href="mailto:${esc(o.email)}">✉ Email</a>`);
  if(o.website) contact.push(`<a class="org-btn" href="${esc(safeUrl(o.website))}" target="_blank" rel="noopener">🔗 Website</a>`);
  return `<div class="org-hero">${logo}
    <div class="org-name">${esc(o.display_name)}</div>
    ${o.tagline?`<div class="org-tag">${esc(o.tagline)}</div>`:""}
    ${o.city?`<div class="org-tag" style="font-size:13px">📍 ${esc(o.city)}</div>`:""}
    ${o.bio?`<div class="org-bio">${esc(o.bio)}</div>`:""}
    <div class="org-stats">${stat(fmtNum(o.creator_count),"Creators")}${stat(fmtNum(o.campaign_count),"Campaigns")}</div>
    ${contact.length?`<div class="org-contact">${contact.join("")}</div>`:""}
  </div>
  ${crCards?`<div class="org-sec"><h3>Featured roster</h3><div class="cr-grid">${crCards}</div></div>`:""}`;
}

(async function(){
  const slug = new URLSearchParams(location.search).get("o");
  const root = document.getElementById("org");
  if(!slug){ root.innerHTML = `<div class="pub-empty">No workspace specified.</div>`; return; }
  if(!sb){ root.innerHTML = `<div class="pub-empty">Couldn't load.</div>`; return; }
  try{
    const { data, error } = await sb.rpc("public_org", { p_slug: slug });
    const o = data || null;
    if(error || !o){ root.innerHTML = `<div class="pub-empty">Workspace not found for “${esc(slug)}”.</div>`; return; }
    document.title = `${o.display_name || "Workspace"} — Geek Influencer OS`;
    root.innerHTML = renderOrg(o);
  }catch(e){ root.innerHTML = `<div class="pub-empty">Couldn't load this workspace.</div>`; }
})();
</script>
</body>
</html>
