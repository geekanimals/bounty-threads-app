# Supabase CLI config. Link with:  supabase link --project-ref edibibytqfrrxfztukpm
project_id = "edibibytqfrrxfztukpm"

[functions.instagram-auth]
verify_jwt = true

[functions.instagram-publish]
verify_jwt = true

# Sign-in flow is called by signed-OUT users, so JWT verification must be off.
[functions.instagram-login]
verify_jwt = false

# Refresh runs from a JWT (user) or a cron secret, so JWT verification is handled in-code.
[functions.instagram-refresh]
verify_jwt = false

# AI assistant — signed-in users only.
[functions.ai-chat]
verify_jwt = true

# WhatsApp sender — signed-in users only (automated sending; app falls back to wa.me links).
[functions.whatsapp-send]
verify_jwt = true

# Phase 2C (DARK, not deployed): Instagram connection OAuth. Start requires a signed-in creator;
# callback is the Meta redirect (no user JWT — the one-time state is the security boundary).
[functions.ig-oauth-start]
verify_jwt = true
[functions.ig-oauth-callback]
verify_jwt = false

# Phase 1B (DARK, not deployed): Instagram webhook. GET verify handshake + POST signature validation
# are the security boundary (no user JWT). NOT registered in the Meta dashboard.
[functions.ig-webhook]
verify_jwt = false

# Phase 1B-fix2 (DARK, not deployed/scheduled): ingestion worker. verify_jwt=false because a valid
# user JWT must NOT authorize this internal endpoint; the handler verifies CI_WORKER_SECRET
# (constant-time) before any service-role/Vault/claim/Meta operation.
[functions.ig-ingest-worker]
verify_jwt = false

# WhatsApp login (OTP) — called by signed-OUT users, so JWT verification is off.
[functions.wa-otp-start]
verify_jwt = false
[functions.wa-otp-verify]
verify_jwt = false
# WhatsApp 1:1 send — signed-in app users only.
[functions.wa-send]
verify_jwt = true
# WhatsApp inbound webhook — Meta calls it; verify-token + x-hub-signature-256 are the boundary.
[functions.wa-webhook]
verify_jwt = false

# Barter pipeline Phase 1 (DARK, not deployed/scheduled): notification + reminder workers. verify_jwt=false
# because a valid user JWT must NOT authorize these internal endpoints; they check CI_WORKER_SECRET and act
# only as service role. ops-notify-dispatch drains ci_outbox (WhatsApp+email); ops-reminder-worker fires SLAs.
[functions.ops-notify-dispatch]
verify_jwt = false
[functions.ops-reminder-worker]
verify_jwt = false

# Barter pipeline Phases 4–6 (DARK, not deployed/scheduled): courier tracking (DTDC/Amazon), AI brief-adherence
# review (Claude), and 15-day post-metrics snapshots. All service-role, CI_WORKER_SECRET-gated, verify_jwt=false.
[functions.ops-tracking-worker]
verify_jwt = false
[functions.ops-content-review]
verify_jwt = false
[functions.ops-post-metrics-worker]
verify_jwt = false
# campaign posts: numbers from each creator's own Instagram + the ad-rights "still live?" check (CI_WORKER_SECRET)
[functions.ci-post-insights-worker]
verify_jwt = false

# Media Kit live refresh (60 s) — signed-in creator syncs only their own posts/stories; server-throttled.
[functions.instagram-media-sync]
verify_jwt = true

# Media Kit: comment moderation + Instagram DM inbox — signed-in creator, own account only.
[functions.instagram-comments]
verify_jwt = true
[functions.instagram-dm]
verify_jwt = true

# Agency / Brand onboarding step 2: official email OTP over SMTP (port 465) — signed-in agency/brand only.
[functions.email-otp]
verify_jwt = true

# Creates / rotates the Super Admin login from Edge secrets (SUPER_ADMIN_EMAIL / SUPER_ADMIN_PASSWORD).
# No user JWT — callable only with the CI_WORKER_SECRET (constant-time check, fail-closed).
[functions.super-admin-sync]
verify_jwt = false

# Instagram discovery for agencies / brands / Super Admin (their own connected Instagram).
[functions.ig-discover]
verify_jwt = true

# Unsubscribe link in update emails / WhatsApp (public; the member's notify token is the key)
[functions.notify-unsubscribe]
verify_jwt = false
# One WhatsApp UTILITY template per campaign — CI_WORKER_SECRET-gated worker (pg_cron every 5 min + on new campaign)
[functions.wa-template-sync]
verify_jwt = false
# Creator search: hourly enrichment of the discovery pool (business discovery) + snowball — CI_WORKER_SECRET-gated
[functions.ig-discover-worker]
verify_jwt = false

# "Connect with Facebook" for creator search — signed-in agency / brand / Super Admin only.
[functions.fb-connect]
verify_jwt = true
