<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Geek OS</title>
  <meta property="og:title" content="Geek OS — your campaign update">
  <meta property="og:description" content="Open the Geek OS app to see your campaign and the next step.">
  <meta property="og:image" content="/assets/geek-icon-192.png">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <style>
    html,body{margin:0;background:#f5f6fb;color:#14162b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
    .spin{width:28px;height:28px;border:3px solid #dfe1f2;border-top-color:#5b5bf0;border-radius:50%;margin:10px auto;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    .sub{color:#5d6380;font-size:14px} a{color:#5b5bf0}
    @media (prefers-color-scheme: dark){ html,body{background:#0f1020;color:#eceefe} .sub{color:#a3a8c8} }
  </style>
</head>
<body>
<div class="wrap"><div id="box"><div class="spin"></div><div class="sub">Opening…</div></div></div>
<script src="/api/config"></script>
<script>
// 🔗 Message short link (<app>/s/<slug>): log the click, then open the real page. Link-preview bots don't run this.
(function(){
  var C = window.GEEK_CONFIG || {}, URL_ = C.supabaseUrl, KEY = C.supabaseKey;
  var m = location.pathname.match(/\/s\/([a-z0-9]{5,16})/i), slug = (m && m[1]) || new URLSearchParams(location.search).get("s") || "";
  var box = document.getElementById("box");
  var fail = function(){ box.innerHTML = '<h2>Link not found</h2><p class="sub">This link isn\'t active any more. <a href="/app.html">Open Geek OS</a></p>'; };
  if(!slug || !URL_ || !KEY){ fail(); return; }
  var vid = ""; try{ vid = localStorage.getItem("gk_v") || ""; if(!vid){ vid = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("gk_v", vid); } }catch(e){}
  var ref = ""; try{ ref = document.referrer ? new URL(document.referrer).hostname : ""; }catch(e){}
  var done = false, t = setTimeout(function(){ if(!done) fail(); }, 8000);
  fetch(URL_ + "/rest/v1/rpc/msg_link_open", { method:"POST", keepalive:true,
    headers:{ "apikey":KEY, "Authorization":"Bearer " + KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ p_slug: slug, p_visitor: vid, p_device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? "mobile" : "desktop",
                           p_ua: navigator.userAgent, p_ref: ref }) })
  .then(function(r){ return r.json(); })
  .then(function(d){ done = true; clearTimeout(t);
    if(!d || !d.ok || !/^https?:\/\//i.test(d.dest || "")){ fail(); return; }
    location.replace(d.dest); })
  .catch(function(){ done = true; clearTimeout(t); fail(); });
})();
</script>
</body>
</html>
