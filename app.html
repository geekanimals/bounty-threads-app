<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geek Influencer OS</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/geek-icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/geek-icon-192.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261106r">
  <link rel="stylesheet" href="bounty-creator.css?v=20261107j">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet">
  <script>
  /* Bounty creator door: decide before the first paint, so a refresh never flashes the old Geek OS screens.
     Same rule as auth.js GEEK_DOOR (plain /app.html = creator; sign-in round trips return to the door that started them). */
  (function(){try{
    var sp=new URLSearchParams(location.search),q=(sp.get("door")||"").toLowerCase(),p=location.pathname.toLowerCase().replace(/\/+$/,"");
    var d={superadmin:"admin",admin:"admin",agency:"owner",owner:"owner",brand:"brand",brands:"brand",creator:"creator"}[q]
      ||{"/superadmin":"admin","/admin":"admin","/agency":"owner","/agencies":"owner","/brand":"brand","/brands":"brand","/creator":"creator","/creators":"creator"}[p]||null;
    if(!d&&["code","state","error","error_description","error_reason"].some(function(k){return sp.has(k);}))d=sessionStorage.getItem("geek_tab_door");
    if((d||"creator")==="creator"){document.documentElement.classList.add("bx-door");if(sp.get("invite"))document.documentElement.classList.add("bx-invite");document.title="Bounty — for creators";}
  }catch(e){}})();
  </script>
<script src="/api/config"></script>
<script src="linkstat.js?v=20261101a" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <script>if(document.documentElement.classList.contains("bx-door"))document.body.classList.add("bx");</script>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">G</div>
        <div class="brand-name">Geek OS</div>
      </div>

      <div class="role-switch">
        <label>Viewing as</label>
        <select id="roleSelect"></select>
      </div>

      <nav id="nav" class="nav"></nav>

      <div class="sidebar-foot">
        <button class="ai-launch" id="aiLaunch">✨ AI Assistant</button>
        <div class="org-box">
          <div class="org-info"><div class="org-name" id="orgLabel">Your Agency</div><div class="who" id="whoLabel"></div></div>
          <button class="sign-out" id="signOutBtn" title="Sign out">⎋</button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn">☰</button>
        <button class="search-trigger" id="searchTrigger">
          <span>🔍 Search or run a command…</span>
          <kbd>⌘K</kbd>
        </button>
        <div class="topbar-right">
          <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
          <button class="icon-btn bell" id="bellBtn" title="Notifications">🔔<span class="badge" id="notifCount">3</span></button>
          <div class="me" id="me"></div>
        </div>
      </header>

      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- Command palette -->
  <div class="palette-overlay" id="paletteOverlay">
    <div class="palette">
      <input type="text" id="paletteInput" placeholder="Jump to a module or run a command…" autocomplete="off">
      <ul id="paletteResults"></ul>
    </div>
  </div>

  <!-- AI drawer -->
  <div class="drawer-overlay" id="aiOverlay">
    <aside class="drawer" id="aiDrawer">
      <div class="drawer-head">
        <div><strong id="aiTitle">AI Assistant</strong><div class="muted" id="aiSub">Contextual agent</div></div>
        <button class="icon-btn" id="aiClose">✕</button>
      </div>
      <div class="ai-body" id="aiBody"></div>
    </aside>
  </div>

  <!-- Notifications drawer -->
  <div class="drawer-overlay" id="notifOverlay">
    <aside class="drawer" id="notifDrawer">
      <div class="drawer-head">
        <div><strong>Notifications</strong><div class="muted">Role-filtered activity</div></div>
        <button class="icon-btn" id="notifClose">✕</button>
      </div>
      <div class="ai-body" id="notifBody"></div>
    </aside>
  </div>

  <!-- Auth gate (renders over everything until signed in) -->
  <div class="auth-root" id="authRoot"></div>
  <!-- shown until the first screen (login or the app) is painted — never a blank page -->
  <div class="boot-splash" id="bootSplash"><div class="boot-box"><img src="/assets/geek-icon-192.png" alt="" class="boot-logo"><div class="mk-spin"></div><div class="boot-t">Loading Geek OS…</div></div></div>
  <script>(function(){var b=document.getElementById("bootSplash");if(b&&document.documentElement.classList.contains("bx-door"))b.innerHTML='<div class="boot-box bx-boot"><div class="bx-boot-logo">B<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#D3A94E"/><circle cx="12" cy="12" r="8" fill="#C2362F"/><circle cx="12" cy="12" r="5" fill="#F4E8CE"/><circle cx="12" cy="12" r="2.4" fill="#C2362F"/></svg>UNTY</div><img src="/assets/bounty/sprout_wave.png" alt="" class="bx-boot-sprout"><div class="bx-boot-bar"><i></i></div><div class="boot-t">Getting your world ready…</div></div>';})();</script>
  <script>window.hideBootSplash=function(){var b=document.getElementById("bootSplash");if(b)b.remove();};setTimeout(window.hideBootSplash,15000);</script>

  <script src="consent.js?v=20261028k"></script>
  <script src="data.js?v=20261106a"></script>
  <script src="auth.js?v=20261106a"></script>
  <script src="track.js?v=20261028k"></script>
  <script src="login.js?v=20261029c"></script>
  <script src="ig-connect.js?v=20261028k"></script>
  <script src="address-form.js?v=20261028k"></script>
  <script src="profile.js?v=20261029d"></script>
  <script src="intelligence.js?v=20261028k"></script>
  <script src="campaign-helper.js?v=20261028k"></script>
  <script src="mk-audience.js?v=20261028k"></script>
  <script src="operations.js?v=20261101a"></script>
  <script src="brand-portal.js?v=20261028m"></script>
  <script src="whatsapp.js?v=20261107a"></script>
  <script src="app.js?v=20261107a"></script>
  <script src="payments.js?v=20261028k"></script>
  <script src="tracking.js?v=20261031g"></script>
  <script src="bounty-creator.js?v=20261107j"></script>
  <script src="bounty-welcome.js?v=20261107f"></script>
</body>
</html>
