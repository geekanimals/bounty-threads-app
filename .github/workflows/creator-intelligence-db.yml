name: Creator Intelligence DB (Phase 0A verification)

# Verifies the additive Creator Intelligence migrations on a DISPOSABLE local Supabase stack.
# It NEVER receives production secrets and NEVER connects to or modifies the remote project:
# no `supabase link`, no `supabase db push`, no `supabase migration repair`, no SUPABASE_ACCESS_TOKEN.
# All commands operate on the ephemeral CI database only.

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/tests-integration/**'
      - '.github/workflows/creator-intelligence-db.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/tests-integration/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.117.0
  # Supabase local Postgres (default host/port/creds; no [db].port override in config.toml)
  DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  foundation:
    name: foundation — reset + pgTAP + deterministic replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Supabase CLI (pinned)
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Command discovery — don't assume the newer CLI behaves like v2.33.9.
      - name: CLI capability discovery
        run: |
          supabase --version
          supabase --help
          supabase db --help
          supabase test --help

      - name: Start local database
        run: supabase db start
      - name: Migration list (local)
        run: supabase migration list --local
      - name: db reset (clean apply of the six CI migrations)
        run: supabase db reset
      - name: Run pgTAP foundation tests
        run: supabase test db
      - name: Schema lint (NOT an advisor — see docs/PHASE_0A_VERIFICATION.md §7)
        run: supabase db lint --level warning || true
      - name: Generated TypeScript types (schema coherence, non-blocking)
        continue-on-error: true
        run: supabase gen types typescript --local > /tmp/ci_types.ts && head -5 /tmp/ci_types.ts
      - name: db reset again (deterministic replay)
        run: supabase db reset
      - name: Stop stack
        if: always()
        run: supabase stop || true

  edge-unit:
    name: edge OAuth unit tests + secret-leak guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno unit tests (Meta OAuth boundary — mocked, no network)
        run: deno test --allow-none supabase/functions/_shared/meta_oauth_test.ts
      - name: Secret-leak guard (fixtures must be synthetic; no real tokens/secrets committed)
        run: |
          set -e
          # Fail on obvious real credentials in migrations/functions (JWTs, Meta tokens, sk- keys,
          # or a hardcoded app secret value). Synthetic SYNTH_*/__SET_VIA_CONFIG__ placeholders are fine.
          if grep -rInE 'eyJ[A-Za-z0-9_-]{20,}|\bIGQ[A-Za-z0-9_-]{20,}|\bsk-[A-Za-z0-9]{20,}|(APP_SECRET|CLIENT_SECRET|SERVICE_ROLE_KEY)\s*[:=]\s*["'"'"'][A-Za-z0-9_-]{16,}' \
                supabase/migrations supabase/functions supabase/tests supabase/tests-integration ; then
            echo "::error::possible committed secret detected"; exit 1
          fi
          echo "no committed secrets detected"

  legacy-coexistence:
    name: legacy fixture + CI migrations + coexistence pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Supabase CLI (pinned)
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start local database
        run: supabase db start

      # Rebuild in production direction: drop the foundation that db-start applied, then apply the
      # LEGACY fixture FIRST and the six CI migrations SECOND.
      - name: Remove auto-applied foundation schemas
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -c "drop schema if exists intel cascade; drop schema if exists private cascade; drop schema if exists api cascade;"

      - name: Apply legacy schema fixture (ordering-corrected)
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests-integration/fixtures/legacy_schema.sql

      - name: Apply the six Creator Intelligence migrations (in order)
        run: |
          for f in supabase/migrations/2026*.sql; do
            echo "== applying $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Ensure pgTAP is installed (direct pg_prove needs it on the path)
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -c "create extension if not exists pgtap with schema public;"

      - name: Run pgTAP (foundation + coexistence) against combined schema
        run: |
          docker run --rm --network host \
            -e PGOPTIONS="-c search_path=public,extensions" \
            -v "$PWD/supabase:/supabase" ghcr.io/supabase/pg_prove:3.36 \
            pg_prove --ext .sql -d "$DB_URL" \
              /supabase/tests/00_phase0a_dark_foundation_test.sql \
              /supabase/tests/01_phase2b_profile_api_test.sql \
              /supabase/tests/02_phase2c_oauth_connection_test.sql \
              /supabase/tests-integration/01_legacy_coexistence_test.sql

      - name: Stop stack
        if: always()
        run: supabase stop || true
